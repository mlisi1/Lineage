[project]
name = "lineage-server"
version = "0.0.0"
description = "Runs the Lineage sim in real time on the device: persistence, state stream, API."
requires-python = ">=3.11,<3.12"
dependencies = ["lineage-sim"]

[tool.uv.sources]
lineage-sim = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lineage_server"]
