[project]
name = "lineage-sim"
version = "0.0.0"
description = "The Lineage world: pure, deterministic simulation. No I/O."
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lineage_sim"]
