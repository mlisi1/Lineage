# Dev-only CLIs (not deployed). Virtual member: `tools` is imported from the repo root
# via `uv run python -m tools.<name>`; this file only declares its dependencies.
[project]
name = "lineage-tools"
version = "0.0.0"
description = "Lineage dev tools: fast-forward runs, milestone reports, plotting style."
requires-python = ">=3.11,<3.12"
dependencies = ["lineage-sim", "numpy>=1.26", "matplotlib>=3.9", "pillow>=10"]

[tool.uv]
package = false

[tool.uv.sources]
lineage-sim = { workspace = true }
