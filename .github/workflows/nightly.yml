# Long statistical tests (`-m slow`), nightly and on demand (CLAUDE.md §6).
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Slow suite
        # Exit code 5 means "no tests collected": allowed until the first statistical
        # milestone (M2) adds slow tests.
        run: uv run pytest -m slow || [ $? -eq 5 ]
